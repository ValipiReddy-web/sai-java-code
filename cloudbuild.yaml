steps:

# Build Java app
- name: 'gcr.io/cloud-builders/mvn'
  args: ['clean','package']

# Build Docker image
- name: 'gcr.io/cloud-builders/docker'
  args:
  - build
  - '-t'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/java-app/app:$SHORT_SHA'
  - '.'

# Push image
- name: 'gcr.io/cloud-builders/docker'
  args:
  - push
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/java-app/app:$SHORT_SHA'

# Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - run
  - deploy
  - java-app
  - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/java-app/app:$SHORT_SHA'
  - '--region=us-central1'
  - '--platform=managed'
  - '--allow-unauthenticated'

images:
- 'us-central1-docker.pkg.dev/$PROJECT_ID/java-app/app:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

